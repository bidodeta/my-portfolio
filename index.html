<html>
  <head>
    <title>Simple Interest Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="maindiv">
      <h1>Simple Interest Calculator</h1>

      Amount <input type="number" id="principal" placeholder="Enter amount" />
      <br />
      Rate
      <input
        type="range"
        id="rate"
        min=""
        max="20"
        value="10.25"
        step="0.25"
        oninput="updateRate()"
      /><span id="rate_val"></span>%
      <br />
      No. of Years <input type="number" id="years" list="all_year" /> <br />
      <datalist id="all_year">
        <option value="1"></option>
        <option value="2"></option>
        <option value="3"></option>
        <option value="4"></option>
        <option value="5"></option>
        <option value="6"></option>
        <option value="7"></option>
        <option value="8"></option>
        <option value="9"></option>
        <option value="10"></option>
      </datalist>
      Interest : <span id="result"></span><br />

      <button onclick="compute()">Compute Interest</button>
      <span id="result"> </span>
    </div>
    <footer>&#169; This Calculator belongs to --your name--</footer>
  </body>
</html>
